<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Gridshot - AimTrainer.gg</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="hud.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
</head>
<body class="game-body">
    
    <!-- UI Layer -->
    <div id="hud-layer">
        <div class="top-bar">
            <div class="stat-box">TIME: <span id="time-display">60.0</span></div>
            <div class="stat-box">SCORE: <span id="score-display">0</span></div>
        </div>
        <div class="side-stats">
            <div class="stat-box">ACC: <span id="acc-display">100</span>%</div>
            <div class="stat-box">COMBO: <span id="combo-display">x1</span></div>
            <div id="fps-display" class="stat-box fps-counter">FPS: 60</div>
        </div>
        <div id="game-crosshair"></div>
        <div id="hitmarker"></div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas-2d"></canvas>

    <!-- Paused / Start Overlay -->
    <div id="pause-menu" class="modal-overlay">
        <div class="modal-content">
            <h2 id="pause-title">2D Training Ready</h2>
            <p>Press Space or click Start to begin.</p>
            <p>Press <kbd>ESC</kbd> or <kbd>P</kbd> to pause at any time.</p>
            <div class="btn-group">
                <button id="resume-btn" class="btn primary-btn">Start Game</button>
                <button id="open-settings-game" class="btn secondary-btn">Settings</button>
                <a href="index.html" class="btn secondary-btn">Quit to Hub</a>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="results-menu" class="modal-overlay hidden">
        <div class="modal-content results-modal">
            <h2>ROUND COMPLETE</h2>
            <div class="results-grid">
                <div class="result-item"><span>Final Score</span><span id="res-score" class="highlight">0</span></div>
                <div class="result-item"><span>Accuracy</span><span id="res-acc">0%</span></div>
                <div class="result-item"><span>Hits</span><span id="res-hits">0</span></div>
                <div class="result-item"><span>Misses</span><span id="res-miss">0</span></div>
                <div class="result-item"><span>Max Combo</span><span id="res-combo">0</span></div>
            </div>
            <button id="restart-btn" class="btn primary-btn">Play Again</button>
            <a href="index.html" class="btn secondary-btn">Back to Hub</a>
        </div>
    </div>

    
    <!-- Shared Settings Modal -->
    <div id="settings-overlay" class="modal-overlay hidden">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h2>Game Settings</h2>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            
            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="sens">Mouse & Sens</button>
                <button class="tab-btn" data-tab="crosshair">Crosshair</button>
                <button class="tab-btn" data-tab="display">HUD & Targets</button>
                <button class="tab-btn" data-tab="audio">Audio</button>
            </div>
            
            <div class="tab-content-container">
                <!-- Sens Tab -->
                <div id="tab-sens" class="tab-pane active">
                    <div class="setting-group">
                        <label>Base Sensitivity (Multiplier)</label>
                        <div class="slider-group">
                            <input type="range" id="sens-slider" min="0.1" max="5.0" step="0.01" value="1.0">
                            <input type="number" id="sens-input" min="0.1" max="10.0" step="0.01" value="1.0">
                        </div>
                    </div>
                    <div class="setting-group">
                        <label>Game Conversion Preset</label>
                        <select id="sens-preset">
                            <option value="raw">Raw Input</option>
                            <option value="valorant">Valorant (Sens * 1.0)</option>
                            <option value="cs2">CS2 / Apex (Sens * 3.18)</option>
                            <option value="overwatch">Overwatch 2 (Sens * 10.60)</option>
                        </select>
                    </div>
                </div>
                
                <!-- Crosshair Tab -->
                <div id="tab-crosshair" class="tab-pane">
                    <div class="crosshair-preview-box">
                        <div id="crosshair-preview"></div>
                    </div>
                    <div class="setting-group">
                        <label>Style</label>
                        <select id="xhair-style">
                            <option value="cross">Classic Cross (+)</option>
                            <option value="dot">Dot Only</option>
                            <option value="circle">Circle</option>
                            <option value="crossdot">Cross + Dot</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>Color</label>
                        <input type="color" id="xhair-color" value="#00ffff">
                    </div>
                    <div class="setting-group">
                        <label>Length</label>
                        <input type="range" id="xhair-length" min="2" max="30" value="10">
                    </div>
                    <div class="setting-group">
                        <label>Thickness</label>
                        <input type="range" id="xhair-thickness" min="1" max="10" value="2">
                    </div>
                    <div class="setting-group">
                        <label>Gap</label>
                        <input type="range" id="xhair-gap" min="0" max="20" value="5">
                    </div>
                </div>
                
                <!-- Display Tab -->
                <div id="tab-display" class="tab-pane">
                    <div class="setting-group">
                        <label>Target Shape</label>
                        <select id="target-shape">
                            <option value="square">Squares / Cubes</option>
                            <option value="circle">Circles / Spheres</option>
                        </select>
                    </div>
                    <div class="setting-group checkbox-group">
                        <input type="checkbox" id="show-target-hitboxes">
                        <label for="show-target-hitboxes">Show Target Hitboxes (Red Outline)</label>
                    </div>
                    <hr style="border: 1px solid #333; margin: 15px 0;">
                    <div class="setting-group">
                        <label>3D Field of View (FOV)</label>
                        <div class="slider-group">
                             <input type="range" id="fov-slider" min="60" max="120" value="90">
                             <span id="fov-display">90</span>
                        </div>
                    </div>
                     <div class="setting-group checkbox-group">
                        <input type="checkbox" id="show-fps" checked>
                        <label for="show-fps">Show FPS Counter</label>
                    </div>
                    <div class="setting-group checkbox-group">
                        <input type="checkbox" id="show-hitmarker" checked>
                        <label for="show-hitmarker">Show Hitmarker</label>
                    </div>
                </div>
                
                <!-- Audio Tab -->
                <div id="tab-audio" class="tab-pane">
                    <div class="setting-group">
                        <label>Master Volume</label>
                        <input type="range" id="vol-master" min="0" max="100" value="50">
                    </div>
                     <div class="setting-group">
                        <label>Hit Sound (Ding)</label>
                        <input type="range" id="vol-hit" min="0" max="100" value="80">
                    </div>
                    <button id="test-hit-sound" class="btn secondary-btn">Test Hit Sound</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="settings.js"></script><script src="sound.js"></script><script src="pause.js"></script><script src="engine2d.js"></script>
</body>
</html>
